<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Relecture du catalogue des formations">
    <meta name="theme-color" content="#183b68">
    <title>Relecture du catalogue · SDIS 53</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./public.css">
    <style>
      .review-page { max-width: 1000px; margin: 0 auto; padding: 28px 18px 56px; }
      .review-banner { padding: 12px 16px; border-radius: 8px; background: #fff3cd; color: #664d03; }
      .review-record-list { display: grid; gap: 14px; margin-top: 20px; }
      .review-record { padding: 18px; border: 1px solid #d5dce5; border-radius: 10px; background: #fff; }
      .review-record h3 { margin: 0 0 8px; }
      .review-record p { margin: 6px 0; white-space: pre-wrap; }
      .review-record ul { margin-bottom: 0; }
      .review-actions { display: grid; gap: 12px; margin-top: 24px; }
      .review-actions textarea { width: 100%; min-height: 120px; }
      .review-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
      .review-error { color: #b02a37; }
      #review-content[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main class="review-page">
      <header>
        <p class="section-kicker">Programme SDIS 53</p>
        <h1>Relecture du catalogue</h1>
      </header>
      <p id="review-status" class="review-banner" role="status" aria-live="polite">Vérification du lien…</p>
      <section id="review-content" hidden>
        <h2 id="review-title"></h2>
        <p>Cette copie est indépendante du catalogue actuellement publié. Les remarques sont transmises aux administrateurs.</p>
        <div id="review-records" class="review-record-list"></div>
        <section class="review-actions" aria-labelledby="review-decision-title">
          <h2 id="review-decision-title">Votre décision</h2>
          <label for="review-comment">Commentaire (obligatoire pour demander des corrections)</label>
          <textarea id="review-comment" maxlength="2000"></textarea>
          <div class="review-buttons">
            <button id="request-corrections" class="button secondary" type="button">Demander des corrections</button>
            <button id="approve-review" class="button primary" type="button">Approuver la version</button>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="./relecture.js"></script>
  </body>
</html>
